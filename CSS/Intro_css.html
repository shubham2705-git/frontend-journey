    <!-- 
    History of CSS

        * CSS (Cascading Style Sheets) was proposed by Håkon Wium Lie on October 10, 1994, 
           while he was working at CERN. Before CSS, HTML was used for both structuring and formatting web pages,
           making websites difficult to maintain.

        * To solve this problem, Håkon Wium Lie introduced CSS as a separate style sheet language that controls 
          the presentation of HTML documents. Later, Bert Bos joined him in developing the CSS specification.

        * The World Wide Web Consortium (W3C) adopted CSS as a web standard and released CSS Level 1 (CSS1) in December 1996.
          Since then, CSS has evolved with several versions:

        * CSS1 (1996): Introduced basic styling features such as fonts, colors, text formatting, margins, and backgrounds.
        * CSS2 (1998): Added advanced layout features, positioning, media types, and support for different devices.
        * CSS2.1 (2011): Improved compatibility by fixing errors and refining CSS2.
        * CSS3 (from 1999 onward): Introduced modules such as Flexbox, Grid Layout, Animations, Transitions, Media Queries, 
           Border Radius, Shadows, and many other modern features.

        * Today, CSS is maintained by the W3C and is one of the three core technologies of web development, 
           alongside HTML (structure) and JavaScript (behavior). It is widely used to create responsive,
            attractive, and interactive websites.
    -->
