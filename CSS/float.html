<!DOCTYPE html>
<html>
<head>
    <title>Float Example</title>

    <style>
        .p1 {
            float: left;
            width: 40%;
            background-color: lightblue;
        }

        .p2 {
            float: right;
            width: 40%;
            background-color: lightgreen;
        }
    </style>
</head>

<body>

    <p class="p1">
        This is the first paragraph. It is floated to the left.
    </p>

    <p class="p2">
        This is the second paragraph. It is floated to the right.
    </p>

</body>
</html>
