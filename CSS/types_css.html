    1. Inline css :-

    1. Inline css :- 
     * Applying the css prop directly inside the html element by using 'style' attribute.
     * Props :- This is the type which have the high precedence.
     * Cons :- This is methods subjected only for on element.
     Example :- 
    
    -->
