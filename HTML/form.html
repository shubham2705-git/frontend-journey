<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="display: flex; gap: 50px">
        <form action="">
        <label for="">Enter Your name:</label>
        <input type="text" id="uName" autofocus value="" maxlength="10" minlength="5" pattern="[A-Za-z]+"  
        title="Name must between 5 to 10,only lowercase and uppercase and _" placeholder="e.g:Jspider" required>
    </form>
    <br>
    <br>
    <label for="">Choose color :</label>
    <input type="color" name="" id=""><br><br>

    <label for="">date</label>
    <input type="date" name="" id=""><br><br>
    
    <label for="">datetime</label>
    <input type="datetime" name="" id=""><br><br>
    
    <input type="datetime-local" name="" id=""><br><br>
    </div>

    <br>
    <hr color="black"><hr color="black">

    <div style="display: flex; gap: 50px;">
    <label for="">Email</label>
    <input type="email" name="" id=""><br><br>
    
    <input type="file" name="" id="" accept=".pdf, .jpeg"><br><br>
    
    <input type="image" src="" alt=""><br><br>
    
    <label for="">Month</label>
    <input type="month" name="" id=""><br><br>
    
    <label for="">Number</label>
    <input type="number" name="" id="" min="18" max="60" step="2"><br><br>
    
    <label for="">Password</label>
    <input type="password" name="" id=""><br><br>
    
    <label for="">Range</label>
    <input type="range" name="" id="" max="100" value="89"><br><br>
    </div>
    <hr color="black">
    <hr color="black">

    <div style="display: flex; gap: 50px;">
    <label for="">Search</label>
    <input type="search" name="" id="" readonly><br><br>
   
    <label for="">Phone</label>
    <input type="tel" name="" id="" maxlength="10" pattern="[0-9]+" title="Enter only digits"><br><br>
    
    <label for="">Time</label>
    <input type="time" name="" id="" ><br><br>
    
    <label for="">Url</label>
    <input type="url" name="" id="" autocomplete="url"><br><br>
    
    <label for="">Week</label>
    <input type="week" name="" id="" ><br><br>
    </div>
    
    <label for="">SpellCheck</label>
    <input type="text" spellcheck="true"><br><br>

    <label for="">Disabled</label>
    <input type="text" disabled>


    <!-- List -->
    <p>Choose your city</p>
    <input list="city">
    <datalist id="city">
        <option value="Bangalore"></option>
        <option value="Hubbali"></option>
        <option value="Chennai"></option>
        <option value="Hyderabad"></option>
        <option value="Bangkok"></option>
        <option value="Bagalkot"></option>
    </datalist>
    <hr  color="black">


    <!-- Single checkbox -->
    <p>Mode of payment</p>
    <input type="radio" name="payment" id="paylater"><label for="paylater">Pay Later</label><br>
    <input type="radio" name="payment" id="emi"><label for="emi">EMI</label><br>
    <input type="radio" name="payment" id="netbanking"><label for="netbanking">Netbanking</label><br>
    <input type="radio" name="payment" id="upi"><label for="upi">UPI</label><br>
    <input type="text" name="" id="" disabled><br>
    <input type="radio" name="payment" id="card"><label for="card">Card</label><br>
    <input type="radio" name="payment" id="cod"><label for="cod">Cash on delivery</label><br>
    
    <!-- Multiple Checkbox -->
    <p>Hobbies</p>
    <input type="checkbox" name="hobby" id="cricket"><label for="cricket">Dreaming</label><br>
    <input type="checkbox" name="hobby" id="football"><label for="football">Football</label><br>
    <input type="checkbox" name="hobby" id="coding"><label for="coding">Coding</label><br>
    <input type="checkbox" name="hobby" id="reading"><label for="reading">Reading</label><br>
    <input type="checkbox" name="hobby" id="sleeping"><label for="sleeping">Sleeping</label><br>
    <input type="checkbox" name="hobby" id="dreaming"><label for="dreaming">Dreaming</label><br>

    <!-- Dropdown -->
    <p>Select Country</p>
    <select name="country">
        <option value="" hidden>--Select Country--</option>
        <option value="india" selected>India</option>
        <option value="usa">USA</option>
        <option value="uk">United Kingdom</option>
        <option value="canada">Canada</option>
        <option value="australia">Australia</option>
    </select>

    <!-- Long Text -->
     <p>Add your comment</p>
     <textarea name="" id="comment" cols="30" rows="10" style="resize: none;" placeholder="What's on your mind" maxlength="150"></textarea>
     <p>Remaining Characters:<span id="res">150</span></p>   
     <script>
        const ele = document.getElementById("comment");
        ele.oninput = function(){
            document.getElementById("res").textContent = 150- ele.value.length
        }
     </script>

     <!-- Buttons -->
    <button>Next</button>
    <input type="submit" value="Login">
    <input type="reset" value="Reset">

</body>
</html>
